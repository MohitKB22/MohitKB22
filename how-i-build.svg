<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
  <title id="title">How I build AI products</title>
  <desc id="desc">A loop of six steps. 1 Understand: sit with the workflow and find the real problem. 2 Design: pick the architecture before the code. 3 Build: API, UI, data model and tests. 4 Integrate: wire in models, tools and retrieval. 5 Evaluate: metrics, guardrails and human approval. 6 Ship and watch: deploy, monitor and fix what users hit. Feedback from real use goes back into step 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset="0.55" stop-color="#0a1630"/>
      <stop offset="1" stop-color="#0d2149"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.09"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#3b82f6" stroke-width="1.6"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .box { fill: #0b1a3d; stroke: #1e40af; stroke-opacity: 1; stroke-width: 1.5; }
      .flow { stroke: #3b82f6; stroke-width: 1.6; fill: none; }
      .num { fill: #0b1a3d; stroke: #38bdf8; stroke-width: 1.6; }
      .n { font-size: 15px; font-weight: 600; fill: #7dd3fc; text-anchor: middle; }
      .t { font-size: 24px; font-weight: 600; fill: #e2e8f0; }
      .d { font-size: 18px; fill: #94a3b8; }
      .step .num { animation: lit 9s ease-in-out infinite; }
      .s2 .num { animation-delay: 1.5s } .s3 .num { animation-delay: 3s } .s4 .num { animation-delay: 4.5s }
      .s5 .num { animation-delay: 6s } .s6 .num { animation-delay: 7.5s }
      @keyframes lit { 0%, 18%, 100% { fill: #0b1a3d } 6%, 12% { fill: #1d4ed8 } }
      @media (prefers-reduced-motion: reduce) { .step .num { animation: none } }
    </style>
  </defs>

  <rect width="1000" height="560" fill="url(#bg)"/>
  <rect width="1000" height="560" fill="url(#dots)"/>

  <text x="48" y="76" font-size="30" font-weight="600" fill="#e2e8f0">How I build AI products</text>

  <!-- order: 1 → 2 → 3, down to 4, then 4 → 5 → 6, and back to 1 -->
  <path class="flow" d="M360 195H396" marker-end="url(#arrow)"/>
  <path class="flow" d="M650 195H686" marker-end="url(#arrow)"/>
  <path class="flow" d="M815 270V336" marker-end="url(#arrow)"/>
  <path class="flow" d="M690 415H654" marker-end="url(#arrow)"/>
  <path class="flow" d="M400 415H364" marker-end="url(#arrow)"/>
  <path class="flow" d="M110 415H66V195H106" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="50" y="305" font-size="15" font-style="italic" fill="#7dd3fc" text-anchor="middle" transform="rotate(-90 50 305)">Feedback from real use</text>

  <g class="step s1">
    <rect class="box" x="110" y="120" width="250" height="150" rx="4"/>
    <circle class="num" cx="138" cy="150" r="14"/><text class="n" x="138" y="155">1</text>
    <text class="t" x="162" y="158">Understand</text>
    <text class="d" x="132" y="206">Sit with the workflow.</text>
    <text class="d" x="132" y="232">Find the real problem.</text>
  </g>
  <g class="step s2">
    <rect class="box" x="400" y="120" width="250" height="150" rx="4"/>
    <circle class="num" cx="428" cy="150" r="14"/><text class="n" x="428" y="155">2</text>
    <text class="t" x="452" y="158">Design</text>
    <text class="d" x="422" y="206">Pick the architecture</text>
    <text class="d" x="422" y="232">before the code.</text>
  </g>
  <g class="step s3">
    <rect class="box" x="690" y="120" width="250" height="150" rx="4"/>
    <circle class="num" cx="718" cy="150" r="14"/><text class="n" x="718" y="155">3</text>
    <text class="t" x="742" y="158">Build</text>
    <text class="d" x="712" y="206">API, UI, data model</text>
    <text class="d" x="712" y="232">and tests.</text>
  </g>
  <g class="step s4">
    <rect class="box" x="690" y="340" width="250" height="150" rx="4"/>
    <circle class="num" cx="718" cy="370" r="14"/><text class="n" x="718" y="375">4</text>
    <text class="t" x="742" y="378">Integrate</text>
    <text class="d" x="712" y="426">Wire in models, tools</text>
    <text class="d" x="712" y="452">and retrieval.</text>
  </g>
  <g class="step s5">
    <rect class="box" x="400" y="340" width="250" height="150" rx="4"/>
    <circle class="num" cx="428" cy="370" r="14"/><text class="n" x="428" y="375">5</text>
    <text class="t" x="452" y="378">Evaluate</text>
    <text class="d" x="422" y="426">Metrics, guardrails</text>
    <text class="d" x="422" y="452">and human approval.</text>
  </g>
  <g class="step s6">
    <rect class="box" x="110" y="340" width="250" height="150" rx="4"/>
    <circle class="num" cx="138" cy="370" r="14"/><text class="n" x="138" y="375">6</text>
    <text class="t" x="162" y="378">Ship and watch</text>
    <text class="d" x="132" y="426">Deploy, monitor and</text>
    <text class="d" x="132" y="452">fix what users hit.</text>
  </g>
</svg>
