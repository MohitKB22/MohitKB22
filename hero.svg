<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Mohit Barse — AI Engineer, Agentic AI, Applied AI Systems</title>
  <desc id="d">I build complete AI products by connecting models, data, tools, APIs and infrastructure to real-world workflows. Problem, architecture, build, integrate, evaluate, deploy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset="0.55" stop-color="#0a1630"/>
      <stop offset="1" stop-color="#0d2149"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.09"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .node { animation: pulse 4s ease-in-out infinite; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s }
      .n5 { animation-delay: 2.4s } .n6 { animation-delay: 3s }
      @keyframes pulse { 0%, 100% { fill-opacity: .35 } 50% { fill-opacity: .9 } }
      @media (prefers-reduced-motion: reduce) { .node { animation: none } .travel { display: none } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- agent-graph motif, top right -->
  <g stroke="#3b82f6" stroke-opacity="0.28" stroke-width="1.2" fill="none">
    <path d="M905 70 L985 48 L1065 82 L1120 58"/>
    <path d="M985 48 L1010 128 L1065 82"/>
    <path d="M1010 128 L1100 150 L1120 58"/>
    <path d="M905 70 L935 150 L1010 128"/>
  </g>
  <g fill="#60a5fa">
    <circle class="node" cx="905" cy="70" r="4"/>
    <circle class="node n2" cx="985" cy="48" r="5"/>
    <circle class="node n3" cx="1065" cy="82" r="4"/>
    <circle class="node n4" cx="1120" cy="58" r="3.5"/>
    <circle class="node n5" cx="1010" cy="128" r="5"/>
    <circle class="node n6" cx="935" cy="150" r="3.5"/>
    <circle class="node n3" cx="1100" cy="150" r="4"/>
  </g>

  <!-- identity -->
  <text x="64" y="84" class="mono" font-size="14" letter-spacing="3" fill="#7dd3fc">AI ENGINEER  ·  AGENTIC AI  ·  APPLIED AI SYSTEMS</text>
  <text x="62" y="152" class="sans" font-size="62" font-weight="700" fill="#e2e8f0">Mohit Barse</text>
  <text x="64" y="194" class="sans" font-size="21" fill="#94a3b8">I build complete AI products — connecting models, data, tools, APIs</text>
  <text x="64" y="222" class="sans" font-size="21" fill="#94a3b8">and infrastructure to real-world workflows.</text>

  <!-- delivery pipeline -->
  <rect x="64" y="248" width="1072" height="1" fill="url(#rule)"/>
  <path id="track" d="M130 284 H1010" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="4 6"/>
  <circle class="travel" r="4" fill="#38bdf8" fill-opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
    <animate attributeName="fill-opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g class="mono" font-size="13" text-anchor="middle">
    <g>
      <rect x="64" y="268" width="132" height="32" rx="7" fill="#0b1a3d" stroke="#1e40af"/>
      <text x="130" y="289" fill="#cbd5e1">Problem</text>
    </g>
    <g>
      <rect x="240" y="268" width="132" height="32" rx="7" fill="#0b1a3d" stroke="#1e40af"/>
      <text x="306" y="289" fill="#cbd5e1">Architecture</text>
    </g>
    <g>
      <rect x="416" y="268" width="132" height="32" rx="7" fill="#0b1a3d" stroke="#1e40af"/>
      <text x="482" y="289" fill="#cbd5e1">Build</text>
    </g>
    <g>
      <rect x="592" y="268" width="132" height="32" rx="7" fill="#0b1a3d" stroke="#1e40af"/>
      <text x="658" y="289" fill="#cbd5e1">Integrate</text>
    </g>
    <g>
      <rect x="768" y="268" width="132" height="32" rx="7" fill="#0b1a3d" stroke="#2563eb"/>
      <text x="834" y="289" fill="#e2e8f0">Evaluate</text>
    </g>
    <g>
      <rect x="944" y="268" width="132" height="32" rx="7" fill="#0b1a3d" stroke="#1e40af"/>
      <text x="1010" y="289" fill="#cbd5e1">Deploy</text>
    </g>
  </g>
</svg>
