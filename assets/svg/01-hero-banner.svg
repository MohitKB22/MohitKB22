  <circle cx="60" cy="180" r="3" fill="#38bdf8" fill-opacity="0.5"/>
  <circle cx="140" cy="160" r="2" fill="#818cf8" fill-opacity="0.4"/>
  <circle cx="220" cy="190" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
  <line x1="60" y1="180" x2="140" y2="160" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="140" y1="160" x2="220" y2="190" stroke="#818cf8" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="1100" cy="40" r="3" fill="#818cf8" fill-opacity="0.5"/>
  <circle cx="1160" cy="80" r="2" fill="#38bdf8" fill-opacity="0.4"/>
  <circle cx="1050" cy="190" r="2" fill="#818cf8" fill-opacity="0.3"/>
  <line x1="1100" y1="40" x2="1160" y2="80" stroke="#818cf8" stroke-opacity="0.12" stroke-width="1"/>
