  <!-- Status pill -->
  <rect x="510" y="186" width="180" height="24" rx="12" fill="#14532d" fill-opacity="0.9" stroke="#22c55e" stroke-width="0.8"/>
  <circle cx="526" cy="198" r="4.5" fill="#22c55e"/>
  <text x="600" y="202" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#86efac" text-anchor="middle" font-weight="500">● Open to Work · Available Now</text>
