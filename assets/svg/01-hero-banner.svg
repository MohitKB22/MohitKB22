  <text x="600" y="92" font-family="'Segoe UI', system-ui, sans-serif" font-size="56" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">Mohit Barse</text>
  <!-- Accent underline -->
  <rect x="390" y="101" width="420" height="2.5" rx="1.5" fill="url(#accent)"/>
