  </defs>
  <rect width="1200" height="220" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="44" x2="1200" y2="44"/><line x1="0" y1="88" x2="1200" y2="88"/>
    <line x1="0" y1="132" x2="1200" y2="132"/><line x1="0" y1="176" x2="1200" y2="176"/>
    <line x1="200" y1="0" x2="200" y2="220"/><line x1="400" y1="0" x2="400" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/><line x1="800" y1="0" x2="800" y2="220"/>
    <line x1="1000" y1="0" x2="1000" y2="220"/>
  </g>
  <!-- Glow orbs -->
  <ellipse cx="120" cy="60" rx="200" ry="100" fill="#38bdf8" fill-opacity="0.06"/>
  <ellipse cx="1080" cy="150" rx="200" ry="120" fill="#818cf8" fill-opacity="0.06"/>
  <ellipse cx="600" cy="110" rx="300" ry="80" fill="#38bdf8" fill-opacity="0.03"/>
