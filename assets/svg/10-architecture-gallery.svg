  <text x="670" y="62" font-family="'JetBrains Mono',monospace" font-size="10" fill="#64748b">STACK USED</text>
  <text x="670" y="88" font-family="'Segoe UI',sans-serif" font-size="10" fill="#38bdf8">LangChain / LlamaIndex</text>
  <text x="670" y="108" font-family="'Segoe UI',sans-serif" font-size="10" fill="#38bdf8">ChromaDB / Pinecone / FAISS</text>
  <text x="670" y="128" font-family="'Segoe UI',sans-serif" font-size="10" fill="#818cf8">OpenAI / Groq / Ollama</text>
  <text x="670" y="148" font-family="'Segoe UI',sans-serif" font-size="10" fill="#818cf8">HuggingFace Transformers</text>
  <text x="670" y="168" font-family="'Segoe UI',sans-serif" font-size="10" fill="#34d399">FastAPI / Docker</text>
  <text x="670" y="188" font-family="'Segoe UI',sans-serif" font-size="10" fill="#34d399">MLflow / DVC / Airflow</text>
  <text x="670" y="208" font-family="'Segoe UI',sans-serif" font-size="10" fill="#fb923c">AWS / GCP / Azure</text>
  <text x="670" y="228" font-family="'Segoe UI',sans-serif" font-size="10" fill="#fb923c">GitHub Actions / CI-CD</text>
  <text x="670" y="248" font-family="'Segoe UI',sans-serif" font-size="10" fill="#f472b6">PyTorch / TensorFlow</text>
  <text x="670" y="268" font-family="'Segoe UI',sans-serif" font-size="10" fill="#f472b6">scikit-learn / Keras</text>
  <text x="670" y="288" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">PostgreSQL / MongoDB</text>
  <text x="670" y="308" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">Redis / DynamoDB</text>

  <!-- Bottom bar -->
  <line x1="24" y1="342" x2="876" y2="342" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="24" y="356" font-family="'JetBrains Mono',monospace" font-size="9" fill="#334155">Mohit Barse · MohitKB22 · AI/ML Engineer</text>
