<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ag-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" fill-opacity="0.6"/>
    </marker>
    <marker id="arrow2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#818cf8" fill-opacity="0.6"/>
    </marker>
  </defs>
  <rect width="900" height="360" rx="14" fill="url(#ag-bg)"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="13.5" fill="none" stroke="#1e3a5f" stroke-width="1"/>
  <rect x="0" y="0" width="900" height="3" rx="1" fill="url(#ag-top)"/>
  <text x="24" y="30" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">🏗️ Architecture Gallery — RAG + Agent Pipeline</text>
  <line x1="24" y1="42" x2="876" y2="42" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- === LEFT PANEL: RAG Pipeline === -->
  <text x="40" y="62" font-family="'JetBrains Mono',monospace" font-size="10" fill="#38bdf8">RAG PIPELINE</text>

  <!-- User Query node -->
  <rect x="30" y="72" width="130" height="30" rx="6" fill="#0c1d2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="95" y="91" font-family="'Segoe UI',sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="600">👤 User Query</text>

  <!-- Arrow down -->
  <line x1="95" y1="102" x2="95" y2="118" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Embedding node -->
  <rect x="30" y="118" width="130" height="30" rx="6" fill="#0c1d2e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="95" y="137" font-family="'Segoe UI',sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">📐 Embedding Model</text>

  <!-- Arrow down -->
  <line x1="95" y1="148" x2="95" y2="164" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Vector Search -->
  <rect x="30" y="164" width="130" height="30" rx="6" fill="#0c1d2e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="95" y="183" font-family="'Segoe UI',sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">🔎 Vector Search</text>

  <!-- Arrow down -->
  <line x1="95" y1="194" x2="95" y2="210" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Context Builder -->
  <rect x="30" y="210" width="130" height="30" rx="6" fill="#0c1d2e" stroke="#38bdf8" stroke-width="0.6"/>
  <text x="95" y="229" font-family="'Segoe UI',sans-serif" font-size="10" fill="#7dd3fc" text-anchor="middle">📋 Context Builder</text>

