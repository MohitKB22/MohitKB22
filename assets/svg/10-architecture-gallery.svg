  <text x="520" y="176" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86efac" text-anchor="middle">🔨 Feature Eng.</text>
  <line x1="520" y1="186" x2="520" y2="201" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="201" width="140" height="28" rx="6" fill="#1e3a5f" stroke="#34d399" stroke-width="1"/>
  <text x="520" y="219" font-family="'Segoe UI',sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle" font-weight="600">🏋️ Model Training</text>
  <line x1="520" y1="229" x2="520" y2="244" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="244" width="140" height="28" rx="6" fill="#0c1d2e" stroke="#34d399" stroke-width="0.5"/>
  <text x="520" y="262" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86efac" text-anchor="middle">📊 Evaluation</text>
  <line x1="520" y1="272" x2="520" y2="287" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="287" width="140" height="28" rx="6" fill="#0c2014" stroke="#22c55e" stroke-width="1"/>
  <text x="520" y="305" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">🚀 Deploy + Monitor</text>

