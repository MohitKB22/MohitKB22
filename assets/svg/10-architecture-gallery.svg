  <text x="520" y="133" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86efac" text-anchor="middle">✅ Data Validation</text>
  <line x1="520" y1="143" x2="520" y2="158" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#arrow)"/>

