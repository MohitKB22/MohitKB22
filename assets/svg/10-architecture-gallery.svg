  <line x1="300" y1="106" x2="300" y2="130" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="260" y1="130" x2="340" y2="130" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Research Agent -->
