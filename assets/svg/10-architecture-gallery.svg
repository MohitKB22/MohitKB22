  <line x1="262" y1="158" x2="262" y2="178" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="338" y1="158" x2="338" y2="178" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="262" y1="178" x2="338" y2="178" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="300" y1="178" x2="300" y2="196" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow2)"/>

