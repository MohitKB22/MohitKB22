  <rect x="304" y="130" width="68" height="28" rx="6" fill="#0c1d2e" stroke="#818cf8" stroke-width="0.5"/>
  <text x="338" y="148" font-family="'Segoe UI',sans-serif" font-size="9" fill="#a5b4fc" text-anchor="middle">⚙️ Execute</text>

